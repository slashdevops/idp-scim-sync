name: "Build"

on:
  # push:
  #   branches:
  #     - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    name: "Lint"
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e  # v7.0.0
        with:
          go-version-file: ./go.mod

      # The contributor checklist requires golangci-lint, so enforce it here.
      # Configuration lives in .golangci.yml so local and CI runs agree.
      - name: golangci-lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a  # v9.3.0
        with:
          version: v2.13.1
          args: --timeout=5m

  test:
    name: "Test and Build"
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    env:
      MAKE_DEBUG: "true"
    steps:
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Set up Go 1.x
        id: go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e  # v7.0.0
        with:
          go-version-file: ./go.mod

      - name: Go version
        run: |
          go version

      - name: Test
        run: make test

      - name: codecov coverage report
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f  # v7.0.0
        with:
          # Must match PROJECT_COVERAGE_FILE in the Makefile. This previously
          # pointed at ./coverage.out, a path `make test` never writes, so
          # codecov found no files at all on every run.
          files: ./build/coverage.txt
          # `main` is a protected branch, and codecov requires a token for
          # protected branches: without one the upload is accepted and then
          # rejected with "Token required because branch is protected".
          #
          # NOTE: the CODECOV_TOKEN repository secret does not exist yet, so
          # uploads still fail until it is added (Settings -> Secrets and
          # variables -> Actions). fail_ci_if_error is left at its default of
          # false so a missing token cannot break the build; the trade-off is
          # that the failure stays quiet, which is how the wrong path above went
          # unnoticed for so long. Check this step's log after adding the token.
          token: ${{ secrets.CODECOV_TOKEN }}

      - name: govulncheck
        uses: golang/govulncheck-action@032d45514ae346b1db93c04b0c90b841c370344f  # v1.1.0
        with:
          go-version-file: ./go.mod
          repo-checkout: false

      - name: Build
        run: make build
